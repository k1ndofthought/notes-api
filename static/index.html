<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Notes App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
        }
        input, textarea, button {
            width: 100%;
            margin: 8px 0;
            padding: 8px;
        }
        .note {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
        }
        .note button {
            background: crimson;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>My Notes</h2>
<textarea id="x-api-key" placeholder="X-API-Key" type="x-api-key"></textarea>
<input id="title" placeholder="Title" />

<textarea id="content" placeholder="Content"></textarea>
<button onclick="addNote()">Add Note</button>

<div id="notes"></div>

<script>
const API_URL = window.location.origin;

async function fetchNotes() {
    const res = await fetch(`${API_URL}/notes`);
    const notes = await res.json();

    const container = document.getElementById("notes");
    container.innerHTML = "";

    notes.forEach(note => {
        const div = document.createElement("div");
        div.className = "note";
        div.innerHTML = `
            <strong>${note.title}</strong>
            <p>${note.content}</p>
            <button onclick="deleteNote(${note.id})">Delete</button>
        `;
        container.appendChild(div);
    });
}

async function addNote() {
    // 1. Get the values from the inputs
    const apiKey = document.getElementById("x-api-key").value;
    const title = document.getElementById("title").value;
    const content = document.getElementById("content").value;

    // 2. Send the request with the X-API-Key header
    const res = await fetch(`${API_URL}/notes`, {
        method: "POST",
        headers: { 
            "Content-Type": "application/json",
            "X-API-Key": apiKey // This was missing!
        },
        body: JSON.stringify({ title, content })
    });

    if (res.status === 401) {
        alert("Invalid or missing API key!");
        return;
    }

    // 3. Clear inputs and refresh
    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
    fetchNotes();
}

async function deleteNote(id) {
    await fetch(`${API_URL}/notes/${id}`, {
        method: "DELETE"
    });
    fetchNotes();
}



fetchNotes();
</script>

</body>
</html>
